name: Release

# Baut die Windows-Version und erstellt ein GitHub Release, sobald ein Tag v* gepusht wird (zB. v1.2.2)
# oder manuell über "Run workflow" mit Angabe des Tags (Tag wird dann vom Release auf dem gewählten Branch angelegt)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.2"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish ZabbixTrayMonitor.csproj -c Release -r win-x64 --self-contained true -o publish

      # Signieren mit eigenem Code-Signing-Zertifikat (siehe README "Code-Signierung")
      # Läuft nur, wenn die Secrets SIGNING_CERT_PFX_BASE64 und SIGNING_CERT_PASSWORD gesetzt sind
      # Signiert werden nur die eigenen Dateien, die .NET-Runtime-Dateien sind bereits von Microsoft signiert
      - name: Sign
        if: ${{ env.SIGNING_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_CERT_PFX_BASE64))

          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName |
              Select-Object -Last 1 -ExpandProperty FullName

            $files = @(Get-Item publish\ZabbixTrayMonitor.exe, publish\ZabbixTrayMonitor.dll) +
              @(Get-ChildItem publish -Recurse -Filter ZabbixTrayMonitor.resources.dll)

            & $signtool sign /fd SHA256 /f $pfxPath /p $env:SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $files.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed ($LASTEXITCODE)" }

            # Eigenes Zertifikat ist auf dem Runner nicht vertrauenswürdig, deshalb nur prüfen dass eine Signatur vorhanden ist
            foreach ($file in $files) {
              $signature = Get-AuthenticodeSignature $file.FullName
              if ($null -eq $signature.SignerCertificate) { throw "No signature: $($file.FullName)" }
              Write-Host "$($file.Name): $($signature.SignerCertificate.Subject) ($($signature.SignerCertificate.Thumbprint))"
            }
          }
          finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ZabbixTrayMonitor ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64.zip
