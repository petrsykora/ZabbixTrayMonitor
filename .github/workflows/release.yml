name: Release

# Baut die Windows-Version und erstellt ein GitHub Release, sobald ein Tag v* gepusht wird (zB. v1.2.2)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish ZabbixTrayMonitor.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "ZabbixTrayMonitor-${{ github.ref_name }}-win-x64.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ZabbixTrayMonitor ${{ github.ref_name }}
          generate_release_notes: true
          files: ZabbixTrayMonitor-${{ github.ref_name }}-win-x64.zip
