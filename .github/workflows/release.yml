name: Release

# Baut die Windows-Version und erstellt ein GitHub Release, sobald ein Tag v* gepusht wird (zB. v1.3.2).
# oder manuell über "Run workflow" mit Angabe des Tags (Tag wird dann vom Release auf dem gewählten Branch angelegt)
# Mit "dry_run" wird nur gebaut und das Ergebnis als Workflow-Artefakte hochgeladen, ohne Release
#
# Release-Dateien:
#   ZabbixTrayMonitor-<tag>-win-x64-setup.exe               klein, installiert .NET 10 Desktop Runtime nur wenn sie fehlt
#   ZabbixTrayMonitor-<tag>-win-x64-runtime-dependent.msi   klein, benötigt installierte .NET 10 Desktop Runtime
#   ZabbixTrayMonitor-<tag>-win-x64-runtime-dependent.zip   klein, portabel, benötigt .NET 10 Desktop Runtime
#   ZabbixTrayMonitor-<tag>-win-x64.msi                     groß, .NET Runtime enthalten
#   ZabbixTrayMonitor-<tag>-win-x64.zip                     groß, portabel, .NET Runtime enthalten
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.3.2"
        required: true
      dry_run:
        description: "Only build and upload as workflow artifacts, no release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content ZabbixTrayMonitor.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "Version not found in ZabbixTrayMonitor.csproj" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version, tag $env:RELEASE_TAG"

      - name: Publish
        run: |
          dotnet publish ZabbixTrayMonitor.csproj -c Release -r win-x64 --self-contained true -o publish
          dotnet publish ZabbixTrayMonitor.csproj -c Release -r win-x64 --self-contained false -o publish-runtime-dependent

      # Signieren mit eigenem Code-Signing-Zertifikat (siehe README "Code signing")
      # Läuft nur, wenn die Secrets SIGNING_CERT_PFX_BASE64 und SIGNING_CERT_PASSWORD gesetzt sind
      # Signiert werden nur die eigenen Dateien, die .NET-Runtime-Dateien sind bereits von Microsoft signiert
      - name: Sign application
        if: ${{ env.SIGNING_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $files = foreach ($dir in "publish", "publish-runtime-dependent") {
            "$dir\ZabbixTrayMonitor.exe"
            "$dir\ZabbixTrayMonitor.dll"
            Get-ChildItem $dir -Recurse -Filter ZabbixTrayMonitor.resources.dll | ForEach-Object FullName
          }
          .\tools\Sign-Files.ps1 -Path $files

      # Lizenztext (RTF) für die Lizenzdialoge von MSI und setup.exe aus LICENSE erzeugen
      - name: Prepare license text
        shell: pwsh
        run: .\tools\New-LicenseRtf.ps1 -Source LICENSE -Destination installer\License.rtf

      # MSI-Varianten aus den (ggf. signierten) Publish-Ordnern bauen
      - name: Build MSI
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet build installer\msi\ZabbixTrayMonitor.Installer.wixproj -c Release `
            -p:ProductVersion=$env:PACKAGE_VERSION `
            -p:PublishDir="$PWD\publish"
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed" }

          dotnet build installer\msi\ZabbixTrayMonitor.Installer.wixproj -c Release `
            -p:ProductVersion=$env:PACKAGE_VERSION `
            -p:InstallerVariant=RuntimeDependent `
            -p:PublishDir="$PWD\publish-runtime-dependent"
          if ($LASTEXITCODE -ne 0) { throw "Runtime-dependent MSI build failed" }

          Copy-Item installer\msi\bin\Release\SelfContained\ZabbixTrayMonitor.msi "ZabbixTrayMonitor-$env:RELEASE_TAG-win-x64.msi"
          Copy-Item installer\msi\bin\Release\RuntimeDependent\ZabbixTrayMonitor-RuntimeDependent.msi "ZabbixTrayMonitor-$env:RELEASE_TAG-win-x64-runtime-dependent.msi"

      - name: Sign MSI
        if: ${{ env.SIGNING_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          .\tools\Sign-Files.ps1 -Path "ZabbixTrayMonitor-$env:RELEASE_TAG-win-x64.msi", "ZabbixTrayMonitor-$env:RELEASE_TAG-win-x64-runtime-dependent.msi"

      # setup.exe: installiert die aktuelle .NET 10 Desktop Runtime nur wenn nötig, danach das MSI ohne Runtime
      - name: Build setup.exe
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # aktuelle Windows Desktop Runtime 10.x (x64) aus den offiziellen Release-Metadaten von Microsoft
          $metadata = Invoke-RestMethod https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json
          $release = $metadata.releases | Where-Object { $_.'release-version' -eq $metadata.'latest-release' } | Select-Object -First 1
          $runtimeVersion = $release.windowsdesktop.version
          $runtimeFile = $release.windowsdesktop.files | Where-Object { $_.rid -eq 'win-x64' -and $_.name -like '*.exe' } | Select-Object -First 1
          if (-not $runtimeFile) { throw "Windows Desktop Runtime win-x64 installer not found in release metadata" }

          # einmal herunterladen: Größe ermitteln und SHA-512 gegen die Metadaten prüfen (setup.exe lädt sie später selbst)
          $runtimeInstaller = Join-Path $env:RUNNER_TEMP "windowsdesktop-runtime.exe"
          Invoke-WebRequest $runtimeFile.url -OutFile $runtimeInstaller -UseBasicParsing
          $runtimeSize = (Get-Item $runtimeInstaller).Length
          $runtimeSha512 = (Get-FileHash $runtimeInstaller -Algorithm SHA512).Hash
          if ($runtimeSha512 -ne $runtimeFile.hash.ToUpperInvariant()) { throw "SHA-512 of $($runtimeFile.url) does not match the release metadata" }
          Write-Host "Windows Desktop Runtime $runtimeVersion, $runtimeSize bytes, $($runtimeFile.url)"

          dotnet build installer\bundle\ZabbixTrayMonitor.Bundle.wixproj -c Release `
            -p:ProductVersion=$env:PACKAGE_VERSION `
            -p:MsiPath="$PWD\ZabbixTrayMonitor-$env:RELEASE_TAG-win-x64-runtime-dependent.msi" `
            -p:RuntimeUrl="$($runtimeFile.url)" `
            -p:RuntimeSha512="$runtimeSha512" `
            -p:RuntimeSize="$runtimeSize" `
            -p:RuntimeVersion="$runtimeVersion"
          if ($LASTEXITCODE -ne 0) { throw "setup.exe build failed" }

          Copy-Item installer\bundle\bin\Release\ZabbixTrayMonitor-Setup.exe "ZabbixTrayMonitor-$env:RELEASE_TAG-win-x64-setup.exe"

      # Burn Bundle: zuerst die eingebettete Engine signieren, dann das ganze Bundle
      - name: Sign setup.exe
        if: ${{ env.SIGNING_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $setup = "ZabbixTrayMonitor-$env:RELEASE_TAG-win-x64-setup.exe"
          dotnet tool install --global wix --version 5.0.2
          wix burn detach $setup -engine engine.exe
          .\tools\Sign-Files.ps1 -Path engine.exe
          wix burn reattach $setup -engine engine.exe -o $setup
          .\tools\Sign-Files.ps1 -Path $setup

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath "ZabbixTrayMonitor-$env:RELEASE_TAG-win-x64.zip"
          Compress-Archive -Path publish-runtime-dependent\* -DestinationPath "ZabbixTrayMonitor-$env:RELEASE_TAG-win-x64-runtime-dependent.zip"
          Get-ChildItem "ZabbixTrayMonitor-$env:RELEASE_TAG-*" | ForEach-Object { "{0,-70} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      # jede Datei als eigenes Artefakt, damit nur das Benötigte heruntergeladen wird
      - name: Upload setup.exe artifact (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64-setup
          path: ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64-setup.exe
          compression-level: 0

      - name: Upload runtime-dependent MSI artifact (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64-runtime-dependent-msi
          path: ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64-runtime-dependent.msi
          compression-level: 0

      - name: Upload runtime-dependent ZIP artifact (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64-runtime-dependent-portable
          path: ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64-runtime-dependent.zip
          compression-level: 0

      - name: Upload MSI artifact (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64-msi
          path: ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64.msi
          compression-level: 0

      - name: Upload ZIP artifact (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64-portable
          path: ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64.zip
          compression-level: 0

      - name: Create release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ZabbixTrayMonitor ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64-setup.exe
            ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64-runtime-dependent.msi
            ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64-runtime-dependent.zip
            ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64.msi
            ZabbixTrayMonitor-${{ env.RELEASE_TAG }}-win-x64.zip

      # Release-Dateien bei VirusTotal prüfen: Ergebnis als Tabelle in die Release-Beschreibung und
      # virustotal-badge.json (shields.io Endpoint-Badge für die README) als Datei ans Release
      # Läuft nur mit Secret VIRUSTOTAL_API_KEY, ein Fehler bei VirusTotal lässt das Release unverändert
      - name: Check with VirusTotal
        if: ${{ !inputs.dry_run && env.VIRUSTOTAL_API_KEY != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem "ZabbixTrayMonitor-$env:RELEASE_TAG-win-x64*" | ForEach-Object FullName
          .\tools\Submit-VirusTotal.ps1 -Path $files -MarkdownPath virustotal.md -BadgePath virustotal-badge.json

          $notes = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json body --jq .body
          if ($LASTEXITCODE -ne 0) { throw "Reading the release notes failed" }

          $newNotes = (($notes -join "`n").TrimEnd(), (Get-Content virustotal.md -Raw)) -join "`n`n"
          Set-Content release-notes.md -Value $newNotes -Encoding utf8NoBOM

          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Updating the release notes failed" }

          gh release upload $env:RELEASE_TAG virustotal-badge.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Uploading virustotal-badge.json failed" }

      # Neue Version des winget-Pakets PetrSykora.ZabbixMonitor als Pull Request bei microsoft/winget-pkgs einreichen
      # Läuft nur mit Secret WINGET_TOKEN und erst, wenn die erste Version (Workflow "winget") in winget aufgenommen wurde
      - name: Update winget package
        if: ${{ !inputs.dry_run && env.WINGET_TOKEN != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $msiUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/ZabbixTrayMonitor-$env:RELEASE_TAG-win-x64.msi"

          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update PetrSykora.ZabbixMonitor --version $env:PACKAGE_VERSION --urls $msiUrl --token $env:WINGET_TOKEN --submit
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed ($LASTEXITCODE)" }
