name: winget

# Reicht das winget-Manifest aus winget/manifests/... als Pull Request bei microsoft/winget-pkgs ein.
# Für die erste Version des Pakets (danach aktualisiert der Release-Workflow das Paket automatisch).
# Braucht das Secret WINGET_TOKEN: klassischer GitHub Token mit Scope "public_repo"
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version in winget/manifests/p/PetrSykora/ZabbixMonitor, e.g. 1.3.1"
        required: true

permissions:
  contents: read

jobs:
  submit:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Submit manifest to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINGET_TOKEN)) { throw "Secret WINGET_TOKEN is not set" }
          if ($env:PACKAGE_VERSION -notmatch '^\d+(\.\d+){1,3}$') { throw "Invalid version: $env:PACKAGE_VERSION" }

          $manifestPath = "winget\manifests\p\PetrSykora\ZabbixMonitor\$env:PACKAGE_VERSION"
          if (-not (Test-Path $manifestPath)) { throw "Manifest folder not found: $manifestPath" }

          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN $manifestPath
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed ($LASTEXITCODE)" }
