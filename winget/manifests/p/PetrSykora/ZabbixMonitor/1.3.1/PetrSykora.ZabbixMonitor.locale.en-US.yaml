ShortDescription: Windows tray client that shows the current problems of a Zabbix server.
Description: |-
  Zabbix Monitor shows the state of your Zabbix server in the Windows notification area.
  The color of the tray icon tells you at a glance whether everything is OK or whether there are warnings or errors.
  The tooltip and the problems window list the current problems; from the problems window you can acknowledge or suppress them and open the Zabbix dashboard.
  The API token is stored in the Windows Credential Manager. The user interface is available in English, German and Czech.
