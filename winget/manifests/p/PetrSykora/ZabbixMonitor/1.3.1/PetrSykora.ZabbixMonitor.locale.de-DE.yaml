# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.9.0.schema.json

PackageIdentifier: PetrSykora.ZabbixMonitor
PackageVersion: 1.3.1
PackageLocale: de-DE
ShortDescription: Windows-Tray-Client, der die aktuellen Probleme eines Zabbix-Servers anzeigt.
Description: |-
  Zabbix Monitor zeigt den Zustand Ihres Zabbix-Servers im Infobereich von Windows an.
  Die Farbe des Tray-Icons zeigt auf einen Blick, ob alles in Ordnung ist oder ob Warnungen oder Fehler vorliegen.
  Tooltip und Problemfenster listen die aktuellen Probleme auf; im Problemfenster können Sie Probleme bestätigen oder unterdrücken und das Zabbix-Dashboard öffnen.
  Der API Token wird im Windows Credential Manager gespeichert. Die Oberfläche ist auf Deutsch, Englisch und Tschechisch verfügbar.
ManifestType: locale
ManifestVersion: 1.9.0
